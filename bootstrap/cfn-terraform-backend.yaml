AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bootstrap stack for Terraform remote state.
  Creates an S3 bucket with versioning and encryption for state storage.
  Terraform uses native S3 file-based locking (use_lockfile = true),
  so no DynamoDB table is needed.

Parameters:
  ProjectName:
    Type: String
    Default: fun-facts-api
    Description: Project name used for resource naming

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-tfstate-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLSOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  StateBucketName:
    Description: S3 bucket name for Terraform state
    Value: !Ref TerraformStateBucket
  StateBucketArn:
    Description: S3 bucket ARN
    Value: !GetAtt TerraformStateBucket.Arn
